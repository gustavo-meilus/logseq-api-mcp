name: Release & Cross-Platform Testing

on:
  release:
    types: [published]
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  cross-platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: |
          uv run pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=85 \
            --durations=10

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-python${{ matrix.python-version }}
          path: |
            coverage.xml
            .pytest_cache/

  package-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Build package
        run: uv build

      - name: Verify package
        run: |
          uv run python -c "
          from src import tools
          print(f'Tools available: {len(tools.__all__)}')
          assert len(tools.__all__) == 26, f'Expected 26 tools, found {len(tools.__all__)}'
          print('Package verification passed')
          "

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: dist/

  release-summary:
    runs-on: ubuntu-latest
    needs: [cross-platform-test, package-build]
    if: always()

    steps:
      - name: Release Summary
        run: |
          if [ "${{ needs.cross-platform-test.result }}" == "success" ]; then
            echo "Cross-Platform Tests: PASSED"
          else
            echo "Cross-Platform Tests: FAILED"
          fi

          if [ "${{ needs.package-build.result }}" == "success" ] || [ "${{ needs.package-build.result }}" == "skipped" ]; then
            echo "Package Build: PASSED/SKIPPED"
          else
            echo "Package Build: FAILED"
          fi

          if [ "${{ needs.cross-platform-test.result }}" == "success" ]; then
            echo "Release testing completed successfully"
          else
            echo "Release testing failed"
            exit 1
          fi
