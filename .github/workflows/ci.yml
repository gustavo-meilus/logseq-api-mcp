name: Main CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run all tests with coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Validate tool discovery
        run: |
          uv run python -c "
          from src import tools

          expected = sorted([
              'append_block_in_page', 'create_page', 'delete_block', 'delete_page',
              'edit_block', 'find_pages_by_property', 'get_all_page_content',
              'get_all_pages', 'get_block_content', 'get_current_block',
              'get_current_graph', 'get_current_page', 'get_editing_selection',
              'get_linked_flashcards', 'get_page_backlinks', 'get_page_blocks',
              'get_pages_from_namespace', 'get_pages_tree_from_namespace',
              'insert_nested_block', 'query', 'rename_page', 'search',
              'set_block_properties', 'suggest_workspace', 'update_block', 'update_page',
          ])

          discovered = sorted(tools.__all__)
          print(f'Discovered {len(discovered)} tools: {discovered}')

          assert discovered == expected, \
              f'Tool list mismatch.\nExpected: {expected}\nFound: {discovered}'
          assert len(discovered) == 26
          print('All 26 tools discovered')
          "

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-python${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml

  build-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Build package
        run: uv build

      - name: Test package installation
        run: |
          uv run pip install dist/*.whl
          uv run python -c "
          from src import tools
          print(f'Package installation successful: {len(tools.__all__)} tools available')
          assert len(tools.__all__) == 26
          "

  ci-summary:
    runs-on: ubuntu-latest
    needs: [test, build-test]
    if: always()

    steps:
      - name: CI Summary
        run: |
          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "Tests: PASSED"
          else
            echo "Tests: FAILED"
          fi

          if [ "${{ needs.build-test.result }}" == "success" ] || [ "${{ needs.build-test.result }}" == "skipped" ]; then
            echo "Build: PASSED/SKIPPED"
          else
            echo "Build: FAILED"
          fi

          if [ "${{ needs.test.result }}" == "success" ]; then
            echo "CI pipeline completed successfully"
          else
            echo "CI pipeline failed"
            exit 1
          fi
